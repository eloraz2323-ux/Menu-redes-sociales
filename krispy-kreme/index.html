<style>
:root{--green:#08753f;--red:#c82035;--ink:#26352c;--bg:#f4f7f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(120deg,#056638,#0b874b);color:white;text-align:center;padding:27px 16px}

main{max-width:900px;margin:0 auto;padding:22px 14px 36px}
.intro{text-align:center;margin:0 auto 20px;max-width:650px;line-height:1.5}

section{background:white;border-radius:17px;padding:15px;margin:18px 0;box-shadow:0 3px 14px #153c1e10}
section h2{color:var(--green);font-size:22px;margin:4px 4px 13px}
.menu-img{display:block;width:100%;height:auto;border-radius:9px}
.note{font-size:12px;color:#68756c;text-align:center;margin:20px 0 0;line-height:1.5}
footer{background:#075f36;color:white;text-align:center;padding:18px 12px;font-size:12px}
@media(max-width:520px){main{padding:14px 9px 26px}section{padding:9px;border-radius:12px}section h2{font-size:19px}nav a{padding:9px 13px;font-size:14px}}
</style>
