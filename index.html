<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Mis redes sociales</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f8fafc;
    background:radial-gradient(circle at 15% 10%,#3730a3 0,transparent 34%),
               radial-gradient(circle at 90% 85%,#831843 0,transparent 32%),#0b1020}
  main{width:min(100%,420px);padding:30px 24px 24px;border:1px solid #ffffff20;
    border-radius:28px;background:#111827dd;box-shadow:0 24px 80px #0008;text-align:center}
  .avatar{width:82px;height:82px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#ec4899);font-size:32px;font-weight:800}
  h1{font-size:27px;margin:0 0 7px;letter-spacing:.3px}
  p{margin:0 0 25px;color:#cbd5e1}
  .links{display:grid;gap:13px}
  a{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 18px;
    border-radius:15px;color:white;text-decoration:none;font-weight:700;transition:transform .15s,filter .15s}
  a:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .instagram{background:linear-gradient(110deg,#833ab4,#fd1d1d,#fcb045)}
  .facebook{background:#1877f2}
  .tiktok{background:#242424;border:1px solid #ffffff35}
  .icon{font-size:20px}
  footer{margin-top:25px;color:#94a3b8;font-size:12px;letter-spacing:2px}
</style>
</head>
<body>
<main>
  <div class="avatar">J</div>
  <h1>¡Hola! 👋</h1>
  <p>Encuéntrame en mis redes sociales</p>
  <nav class="links" aria-label="Redes sociales">
    <a class="instagram" href="https://www.instagram.com/rdz.juaaan/" target="_blank" rel="noopener noreferrer"><span class="icon">◎</span> Instagram</a>
    <a class="facebook" href="https://www.facebook.com/share/1G1qLYx7dj/" target="_blank" rel="noopener noreferrer"><span class="icon">f</span> Facebook</a>
    <a class="tiktok" href="https://www.tiktok.com/@juaaan_mesmer?_r=1&_t=ZS-9BV1bptCerk" target="_blank" rel="noopener noreferrer"><span class="icon">♪</span> TikTok</a>
  </nav>
  <footer>ABRE · CONECTA · COMPARTE</footer>
</main>
</body>
</html>
