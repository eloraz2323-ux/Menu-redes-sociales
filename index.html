<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff6b8a"><title>Mis redes sociales</title>
<style>
:root{--ink:#25213b;--pink:#ff6b8a;--yellow:#ffd85e;--blue:#71d7f4;--purple:#9a7cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px 34px;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#ffe6a8 0 8%,transparent 9%),radial-gradient(circle at 92% 18%,#c8f4ff 0 10%,transparent 11%),linear-gradient(145deg,#fff1f4,#f4edff 55%,#e8fbff);display:flex;justify-content:center;align-items:center;overflow-x:hidden}
.wrap{width:min(100%,430px);position:relative}.sticker{position:absolute;z-index:0;font-size:30px;filter:drop-shadow(0 4px 0 #ffffff99);user-select:none}.s1{top:8px;left:4px;transform:rotate(-18deg)}.s2{top:82px;right:0;transform:rotate(16deg)}.s3{bottom:115px;left:-2px;transform:rotate(12deg)}.s4{bottom:18px;right:8px;transform:rotate(-12deg)}
.card{position:relative;z-index:1;background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:32px;padding:28px 22px 24px;box-shadow:0 18px 45px #5b4a8a20,0 7px 0 #d9ccff;text-align:center}
.avatar{width:92px;height:92px;margin:0 auto 14px;border-radius:28px;background:linear-gradient(135deg,var(--yellow),var(--pink) 55%,var(--purple));display:grid;place-items:center;border:5px solid white;box-shadow:0 7px 0 #e8dfff;transform:rotate(-5deg)}.avatar span{font-size:42px;font-weight:950;color:white;text-shadow:2px 3px 0 #694c9b}
.eyebrow{display:inline-block;padding:6px 12px;border-radius:99px;background:#fff0b9;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:30px;line-height:1.05;margin:14px 0 8px;font-weight:950;letter-spacing:-1px}.sub{margin:0 auto 22px;color:#6e6882;font-size:14px;max-width:280px}
.links{display:grid;gap:12px}.link{min-height:62px;display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink);padding:11px 15px;border-radius:19px;border:2px solid #fff;box-shadow:0 5px 0 #dcd5ec;transition:transform .15s,box-shadow .15s;font-weight:850}.link:active{transform:translateY(4px);box-shadow:0 1px 0 #dcd5ec}.ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#ffffffc9;font-size:20px;flex:none}.name{flex:1;text-align:left}.arrow{font-size:20px;opacity:.65}.ig{background:#ffd9e5}.fb{background:#dceaff}.tt{background:#d9f7f3}
.hint{margin:22px 0 0;font-size:12px;color:#77718a;font-weight:650}.tap{display:inline-block;margin-top:14px;padding:9px 14px;border-radius:99px;background:#29233f;color:white;font-size:11px;font-weight:800;letter-spacing:.6px}footer{margin-top:17px;text-align:center;font-size:10px;color:#89829a}
@media(prefers-reduced-motion:no-preference){.card{animation:pop .55s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}}
</style></head>
<body><main class="wrap">
<span class="sticker s1" aria-hidden="true">✦</span><span class="sticker s2" aria-hidden="true">💫</span><span class="sticker s3" aria-hidden="true">★</span><span class="sticker s4" aria-hidden="true">✿</span>
<section class="card"><div class="avatar"><span>J</span></div><span class="eyebrow">¡Conectemos!</span><h1>Mis redes sociales</h1><p class="sub">Encuéntrame en tus plataformas favoritas. ¡Sígueme!</p>
<nav class="links" aria-label="Redes sociales">
<a class="link ig" href="https://www.instagram.com/rdz.juaaan/" target="_blank" rel="noopener noreferrer"><span class="ico">📸</span><span class="name">Instagram</span><span class="arrow">↗</span></a>
<a class="link fb" href="https://www.facebook.com/share/1G1qLYx7dj/" target="_blank" rel="noopener noreferrer"><span class="ico">f</span><span class="name">Facebook</span><span class="arrow">↗</span></a>
<a class="link tt" href="https://www.tiktok.com/@juaaan_mesmer?_r=1&_t=ZS-9BV1bptCerk" target="_blank" rel="noopener noreferrer"><span class="ico">♪</span><span class="name">TikTok</span><span class="arrow">↗</span></a>
</nav><p class="hint">Un toque y estamos conectados</p><span class="tap">✦ TAP TO CONNECT ✦</span></section><footer>Tarjeta digital · Compartida mediante NFC</footer>
</main></body></html>
